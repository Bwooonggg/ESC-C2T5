services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_LANGGRAPH_URL: /api
    image: das-agent-frontend:dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      langgraph-dev:
        condition: service_healthy

  langgraph-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: das-agent:dev
    restart: unless-stopped
    env_file:
      - path: .env.shipit
        required: false
    environment:
      PORT: "2024"
      DATABASE_URI: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or .env.shipit}@postgres:5432/${POSTGRES_DB:-langgraph}
      REDIS_URI: redis://redis:6379/0
      MILVUS_DB_PATH: /app/data/milvus/docling.db
      RUN_INGEST: "false"
      HF_HOME: /data/huggingface
    volumes:
      - model-cache:/data/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langgraph}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or .env.shipit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  model-cache:
